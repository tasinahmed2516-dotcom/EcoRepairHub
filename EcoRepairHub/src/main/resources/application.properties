spring.application.name=ecorepairhub
server.port=8081
# --- Default: in-memory H2, so the app runs immediately with no setup ---
spring.datasource.url=jdbc:h2:mem:ecorepairhub;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swap to MySQL for real use: comment out the H2 block above and uncomment below ---
# spring.datasource.url=jdbc:mysql://localhost:3306/ecorepairhub?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
